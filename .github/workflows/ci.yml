name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Both clients consume the same reviewed MetaMesh revision, not its moving main.
env:
  MESH_REVISION: 5e623a8e8ed0261d6235df27a841486462d1ef08
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: paket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: paket
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bobishh/meta-mesh
          ref: ${{ env.MESH_REVISION }}
          path: mesh
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          components: rustfmt
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: paket -> target
          key: native-${{ env.MESH_REVISION }}
      - name: Install Bevy system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev pkg-config
      - run: cargo fmt -- --check
      - name: Test game rules, geometry and native peer sessions
        # Keep the first CI compile small; local dev optimizes dependencies.
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --workspace --locked
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 0
          CARGO_PROFILE_DEV_DEBUG: 0
          RUST_BACKTRACE: 1

  browser:
    name: Browser tests and WASM build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: paket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: paket
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: bobishh/meta-mesh
          ref: ${{ env.MESH_REVISION }}
          path: mesh
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: paket/web/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: paket -> target
          key: browser-${{ env.MESH_REVISION }}
      - run: npm ci --install-links
        working-directory: paket/web
      - run: npm run check && npm test
        working-directory: paket/web
      - name: Install the wasm-bindgen version from Cargo.lock
        run: |
          version=$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build the browser game and Worker assets
        run: ./scripts/build-web.sh
      - name: Save the tested browser build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-build
          path: |
            paket/web/dist/
            paket/web/src/worker.mjs
            paket/web/wrangler.jsonc
          if-no-files-found: error
          retention-days: 7
